<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Athlete Game Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
<style>
:root{
  --bg:#F6F4F8; --surface:#FFFFFF; --surface-2:#EFEAF4; --ink:#211A2C; --ink-2:#584E68; --muted:#857B95;
  --line:#E2DBEA; --brand:#6D3BD6; --brand-ink:#FFFFFF; --s1:#6D3BD6; --s2:#00968C;
  --good:#1F8A4C; --bad:#C6303F; --gold:#E8A93A; --radius:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#130E1C; --surface:#1D1628; --surface-2:#271E36; --ink:#F0EAF8; --ink-2:#C7BCD8; --muted:#9A8FAD;
  --line:#342A45; --brand:#8F6BF0; --brand-ink:#130A20; --s1:#8F6BF0; --s2:#12A093;
  --good:#4FD08A; --bad:#FF6B75; --gold:#F0BE5E;
}}
:root[data-theme="dark"]{
  --bg:#130E1C; --surface:#1D1628; --surface-2:#271E36; --ink:#F0EAF8; --ink-2:#C7BCD8; --muted:#9A8FAD;
  --line:#342A45; --brand:#8F6BF0; --brand-ink:#130A20; --s1:#8F6BF0; --s2:#12A093;
  --good:#4FD08A; --bad:#FF6B75; --gold:#F0BE5E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2{line-height:1.2;text-wrap:balance;margin:0}
.hide{display:none!important}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .name{font-weight:800;margin-right:auto;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--brand)}
.page{padding:18px 16px 64px;max-width:1040px;width:100%;margin:0 auto}
.btn{border:1px solid transparent;border-radius:12px;background:var(--brand);color:var(--brand-ink);font-weight:700;
  padding:11px 18px;cursor:pointer;transition:filter .15s,transform .06s}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:translateY(1px)}
.btn.sec{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--line)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
select,input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:var(--surface);color:var(--ink-2);border:0;padding:7px 11px;cursor:pointer;font-size:14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.grid{display:grid;gap:14px} .cols{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(138px,1fr))}
.tile{background:var(--surface-2);border-radius:14px;padding:13px 14px}
.tile .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .v{font-size:clamp(21px,4.4vw,29px);font-weight:800;font-variant-numeric:tabular-nums}
.tile .u{font-size:13px;color:var(--ink-2);font-weight:600}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.num,th.num{text-align:right}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)} .small{font-size:13px}
.list{display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.item .grow{flex:1;min-width:120px}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.note{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--ink-2)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin:2px 0 6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
figure{margin:0} figcaption{font-size:13px;color:var(--muted);margin-top:6px}
.chart-wrap{overflow-x:auto}
ol.steps{padding-left:20px;margin:8px 0 0} ol.steps li{margin:6px 0}
.gamecards{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.gcard{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:16px;cursor:pointer;
  display:flex;gap:14px;align-items:center;text-align:left}
.gcard:hover{border-color:var(--brand)}
.gcard .emo{font-size:34px;line-height:1}
.gcard b{display:block;font-size:17px} .gcard span{font-size:13px;color:var(--muted)}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;
  padding:5px 9px;border-radius:8px;opacity:0;transition:opacity .12s}

#run{position:fixed;inset:0;z-index:40;background:#0B0813;color:#F4ECFF}
#vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cv{position:absolute;inset:0;width:100%;height:100%}
.hud{position:absolute;left:0;right:0;top:0;z-index:3;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;
  display:flex;gap:7px;flex-wrap:wrap;align-items:flex-start}
.chip{background:rgba(11,8,19,.66);border:1px solid rgba(255,255,255,.28);border-radius:10px;padding:6px 10px;
  font-weight:700;font-size:12.5px;color:#F4ECFF;cursor:pointer}
.chip.ok{border-color:rgba(99,227,155,.7);color:#9BF0C0}
.chip.warn{border-color:rgba(255,107,117,.7);color:#FFB3B8}
#big{position:absolute;left:0;right:0;top:24%;text-align:center;z-index:3;padding:0 14px;pointer-events:none}
#bigNum{font-size:clamp(38px,13vw,84px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1;
  text-shadow:0 4px 20px rgba(0,0,0,.8)}
#bigSub{font-weight:700;font-size:clamp(13px,3.7vw,19px);margin-top:6px;text-shadow:0 2px 10px rgba(0,0,0,.9)}
#btnRow{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:0 14px;z-index:4;
  display:flex;flex-direction:column;gap:9px;align-items:center}
.bigbtn{border:3px solid #fff;border-radius:999px;background:var(--brand);color:#fff;font-weight:800;letter-spacing:.05em;
  font-size:clamp(16px,4.4vw,23px);padding:14px 28px;width:100%;max-width:430px;cursor:pointer}
.bigbtn.ghost{background:rgba(255,255,255,.16)} .bigbtn.stop{background:#C6303F}
.handle{position:absolute;z-index:5;touch-action:none}
.handle.v{top:0;bottom:0;width:46px;margin-left:-23px;cursor:ew-resize}
.handle.v::before{content:"";position:absolute;left:22px;top:0;bottom:0;width:3px;background:var(--gold)}
.handle.h{left:0;right:0;height:48px;margin-top:-24px;cursor:ns-resize}
.handle.h::before{content:"";position:absolute;left:0;right:0;top:23px;height:3px;background:var(--gold)}
.handle span{position:absolute;background:var(--gold);color:#1A1206;font-size:11px;font-weight:800;padding:3px 7px;border-radius:7px}
.handle.v span{bottom:10px;left:50%;transform:translateX(-50%)} .handle.h span{left:12px;top:2px}
#rot{position:absolute;inset:0;z-index:9;background:rgba(11,8,19,.95);display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:24px}
@media (orientation:landscape){
  #big{top:31%} #bigNum{font-size:clamp(28px,8vh,58px)} #bigSub{font-size:clamp(12px,2.6vh,17px)}
  .bigbtn{font-size:clamp(14px,3.4vh,19px);padding:10px 22px;max-width:320px}
  #btnRow{flex-direction:row;justify-content:center;bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  .chip{padding:5px 8px;font-size:11.5px}
}
@media print{.bar,.noprint{display:none!important} body{background:#fff;color:#000} .card{border:1px solid #bbb;break-inside:avoid}}
</style>

<header class="bar noprint">
  <span class="name"><span class="dot"></span><span data-t="app"></span></span>
  <span class="seg" id="langSeg">
    <button data-lang="uz" aria-pressed="true">UZ</button><button data-lang="ru">RU</button><button data-lang="en">EN</button>
  </span>
  <button class="btn sec sm" id="navHome" data-t="nav_home"></button>
  <button class="btn sec sm" id="navCoach" data-t="nav_coach"></button>
</header>

<main class="page" id="home">
  <div class="grid" style="gap:18px">
    <div class="card">
      <h1 style="font-size:clamp(24px,5vw,32px)" data-t="home_title"></h1>
      <p class="muted" style="margin:8px 0 0" data-t="home_sub"></p>
      <div class="row" style="margin-top:14px">
        <label class="small muted" for="playerSel" data-t="athlete"></label>
        <select id="playerSel" style="min-width:180px"></select>
        <button class="btn sec sm" id="addPlayer" data-t="add_athlete"></button>
      </div>
      <p class="small" id="engineState" style="margin:12px 0 0"></p>
    </div>
    <div class="gamecards" id="gameCards"></div>
    <div class="card" id="lastCard"></div>
  </div>
</main>

<main class="page hide" id="coach">
  <h1 style="font-size:clamp(22px,4.6vw,30px)" data-t="coach_title"></h1>
  <div class="grid" style="margin-top:16px">
    <div class="card"><div class="row" style="justify-content:space-between">
      <h2 style="font-size:19px" data-t="groups"></h2><button class="btn sm" id="addGroup" data-t="new_group"></button></div>
      <div class="list" id="groupList" style="margin-top:14px"></div></div>
    <div class="card"><div class="row" style="justify-content:space-between">
      <h2 style="font-size:19px" data-t="athletes"></h2><button class="btn sm" id="addPlayer2" data-t="add_athlete"></button></div>
      <div class="list" id="playerList" style="margin-top:14px"></div></div>
    <div class="card"><h2 style="font-size:19px" data-t="sessions"></h2><div class="list" id="sessList" style="margin-top:14px"></div></div>
    <div class="row"><button class="btn sec sm" id="exportBtn" data-t="export_csv"></button></div>
  </div>
</main>

<main class="page hide" id="report"></main>
<main class="page hide" id="groupView"></main>
<main class="page hide" id="groupReport"></main>

<div id="run" class="hide">
  <video id="vid" playsinline muted autoplay></video>
  <canvas id="cv"></canvas>
  <div class="handle v hide" id="hA"><span>A</span></div>
  <div class="handle v hide" id="hB"><span>B</span></div>
  <div class="handle h hide" id="hF"><span data-t="feet_line"></span></div>
  <div class="hud">
    <button class="chip" id="quit" data-t="exit"></button>
    <span class="chip" id="whoChip"></span>
    <span class="chip" id="stateChip"></span>
    <span class="chip" id="trackChip"></span>
  </div>
  <div id="big"><div id="bigNum"></div><div id="bigSub"></div></div>
  <div id="btnRow">
    <button class="bigbtn" id="goBtn"></button>
    <button class="bigbtn ghost hide" id="altBtn"></button>
  </div>
  <div id="rot" class="hide">
    <div style="font-size:56px;line-height:1">&#128241;</div>
    <h2 id="rotT" style="font-size:21px;margin:10px 0 6px"></h2>
    <p id="rotX" class="small" style="max-width:32ch;opacity:.9;margin:0"></p>
  </div>
</div>
<div id="tip"></div>

/* ===================== small maths ===================== */
function mean(a){ return a.length? a.reduce(function(x,y){return x+y;},0)/a.length:null; }
function sd(a){ if(a.length<2) return null; var m=mean(a);
  return Math.sqrt(a.reduce(function(s,x){return s+(x-m)*(x-m);},0)/(a.length-1)); }
function f0(v){ return v==null? "–":Math.round(v).toString(); }
function f1(v){ return v==null? "–":v.toFixed(1); }
function f2(v){ return v==null? "–":v.toFixed(2); }
function dateStr(iso){ var d=new Date(iso);
  return d.toLocaleDateString(lang==="uz"?"uz-UZ":(lang==="ru"?"ru-RU":"en-GB"))+" "+d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}); }
var G=9.81;

/* per-game summary + "better is" direction */
function summary(s){
  if(s.type==="react"){
    var r=s.trials.filter(function(x){return x.rt!=null;}).map(function(x){return x.rt;});
    var side={left:[],right:[],top:[]};
    s.trials.forEach(function(x){ if(x.rt!=null) side[x.box<=2?"top":(x.box<=4?"left":"right")].push(x.rt); });
    var third=Math.max(1,Math.floor(r.length/3));
    return {main:mean(r), unit:"ms", lower:true, caught:r.length, n:s.trials.length,
      best:r.length?Math.min.apply(null,r):null, sd:sd(r),
      left:mean(side.left), right:mean(side.right), top:mean(side.top),
      first:mean(r.slice(0,third)), last:mean(r.slice(-third))};
  }
  if(s.type==="shuttle"){
    return {main:s.time, unit:"s", lower:true, speed:(s.legs*s.legLen)/s.time, splits:s.splits||[]};
  }
  var hs=s.attempts.map(function(a){return a.h;});
  var best=hs.length?Math.max.apply(null,hs):null;
  return {main:best, unit:"cm", lower:false, mean:mean(hs), sd:sd(hs),
    flight:(s.attempts.filter(function(a){return a.h===best;})[0]||{}).t};
}
function bestValue(ty,id){
  var l=ofAthlete(ty,id).map(function(s){ return summary(s).main; }).filter(function(v){return v!=null;});
  if(!l.length) return null;
  return (ty==="jump")? Math.max.apply(null,l) : Math.min.apply(null,l);
}
function groupAvg(ty, age, exclude){
  var v=[]; byType(ty).forEach(function(s){
    if(exclude && s.athleteId===exclude) return;
    var a=athlete(s.athleteId); if(a&&a.age===age){ var m=summary(s).main; if(m!=null) v.push(m); }
  });
  return v.length>=3? mean(v):null;
}
function gameName(ty){ return ty==="react"? t("g_react") : (ty==="shuttle"? t("g_shuttle") : t("g_jump")); }
function unitOf(ty){ return ty==="react"? "ms" : (ty==="shuttle"? t("s_time").toLowerCase().slice(0,1):"cm"); }
function fmtMain(ty,v){ return ty==="react"? f0(v) : (ty==="shuttle"? f2(v) : f1(v)); }

/* ===================== charts ===================== */
var tipEl=document.getElementById("tip");
document.addEventListener("mousemove",function(ev){
  var el=ev.target.closest? ev.target.closest("[data-lbl]"):null;
  if(el){ tipEl.textContent=el.getAttribute("data-lbl"); tipEl.style.opacity="1";
    tipEl.style.left=Math.min(window.innerWidth-140,ev.clientX+12)+"px"; tipEl.style.top=(ev.clientY-34)+"px"; }
  else tipEl.style.opacity="0";
});
function lineChart(pts, opt){
  opt=opt||{};
  if(!pts.length) return '<p class="muted">'+t("no_data")+'</p>';
  var W=640,H=opt.h||230,P={l:52,r:14,t:14,b:30};
  var ys=pts.map(function(p){return p[1];}).concat(opt.ref?[opt.ref]:[]);
  var mx=Math.max.apply(null,ys), mn=Math.min.apply(null,ys);
  var pad=(mx-mn)*0.25+ (mx===mn? Math.abs(mx)*0.1+1:0); mx+=pad*0.4; mn=Math.max(opt.zero?0:mn-pad, 0);
  var xs=pts.map(function(p){return p[0];}), xmax=Math.max.apply(null,xs), xmin=Math.min.apply(null,xs);
  var x=function(v){ return P.l+(W-P.l-P.r)*(xmax===xmin?0.5:(v-xmin)/(xmax-xmin)); };
  var y=function(v){ return H-P.b-(H-P.t-P.b)*((v-mn)/(mx-mn||1)); };
  var s="",i;
  for(i=0;i<=4;i++){ var v=mn+(mx-mn)*i/4, yy=y(v);
    s+='<line x1="'+P.l+'" y1="'+yy+'" x2="'+(W-P.r)+'" y2="'+yy+'" stroke="var(--line)"/>'+
       '<text x="'+(P.l-8)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+
       (opt.dec? v.toFixed(opt.dec):Math.round(v))+'</text>'; }
  if(opt.ref!=null) s+='<line x1="'+P.l+'" y1="'+y(opt.ref)+'" x2="'+(W-P.r)+'" y2="'+y(opt.ref)+
    '" stroke="var(--s2)" stroke-width="2" stroke-dasharray="7 5"/>';
  (opt.marks||[]).forEach(function(m){ s+='<line x1="'+x(m)+'" y1="'+P.t+'" x2="'+x(m)+'" y2="'+(H-P.b)+
    '" stroke="var(--s2)" stroke-width="2" stroke-dasharray="4 5" opacity=".8"/>'; });
  s+='<path d="'+pts.map(function(p,i){return (i?"L":"M")+x(p[0]).toFixed(1)+" "+y(p[1]).toFixed(1);}).join(" ")+
     '" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>';
  if(!opt.noDots) pts.forEach(function(p){ s+='<circle cx="'+x(p[0]).toFixed(1)+'" cy="'+y(p[1]).toFixed(1)+
    '" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2" data-lbl="'+(opt.dec?p[1].toFixed(opt.dec):Math.round(p[1]))+' '+(opt.unit||"")+'"/>'; });
  (opt.misses||[]).forEach(function(mx2){ var xx=x(mx2);
    s+='<g data-lbl="'+t("r_missed")+'"><line x1="'+(xx-5)+'" y1="'+(H-P.b-16)+'" x2="'+(xx+5)+'" y2="'+(H-P.b-6)+'" stroke="var(--bad)" stroke-width="2"/>'+
       '<line x1="'+(xx-5)+'" y1="'+(H-P.b-6)+'" x2="'+(xx+5)+'" y2="'+(H-P.b-16)+'" stroke="var(--bad)" stroke-width="2"/></g>'; });
  [xmin,(xmin+xmax)/2,xmax].forEach(function(v){
    s+='<text x="'+x(v)+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+
       (opt.xdec? v.toFixed(opt.xdec):Math.round(v))+'</text>'; });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" role="img" style="min-width:520px">'+s+'</svg>';
}
function barChart(rows, opt){
  opt=opt||{};
  if(!rows.length) return "";
  var W=540,rowH=34,H=rowH*rows.length+14,P={l:opt.l||120,r:66,t:6};
  var max=Math.max.apply(null,rows.map(function(r){return r[1];}))*1.14, out="";
  rows.forEach(function(r,i){
    var w=(W-P.l-P.r)*(r[1]/max), y=P.t+i*rowH;
    out+='<text x="'+(P.l-10)+'" y="'+(y+21)+'" text-anchor="end" font-size="13" fill="var(--ink-2)">'+r[0]+'</text>'+
      '<rect x="'+P.l+'" y="'+(y+7)+'" width="'+w.toFixed(1)+'" height="20" rx="4" fill="var(--s1)" opacity="'+(r[2]===false?".6":"1")+
      '" data-lbl="'+r[0]+' — '+(opt.dec? r[1].toFixed(opt.dec):Math.round(r[1]))+' '+(opt.unit||"")+'"/>'+
      '<text x="'+(P.l+w+8)+'" y="'+(y+22)+'" font-size="13" font-weight="700" fill="var(--ink)">'+
      (opt.dec? r[1].toFixed(opt.dec):Math.round(r[1]))+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" role="img" style="min-width:420px">'+out+'</svg>';
}

/* ===================== reports ===================== */
function tile(k,v,u,col){ return '<div class="tile"><div class="k">'+k+'</div><div class="v"'+(col?' style="color:'+col+'"':'')+
  '>'+v+'<span class="u"> '+(u||"")+'</span></div></div>'; }
function report(sid){
  var s=db.sessions.filter(function(x){return x.id===sid;})[0];
  if(!s){ go("coach"); return; }
  var p=athlete(s.athleteId)||{name:"?",age:0}, su=summary(s), gb=groupAvg(s.type,p.age,p.id);
  var body="";
  if(s.type==="react"){
    var pts=[], miss=[];
    s.trials.forEach(function(x,i){ if(x.rt!=null) pts.push([i+1,x.rt]); else miss.push(i+1); });
    var tiers=[[0,10,3],[10,20,2],[20,30,1]].map(function(r){
      var part=s.trials.slice(r[0],r[1]), v=part.filter(function(x){return x.rt!=null;}).map(function(x){return x.rt;});
      return '<tr><td>'+r[2]+' s</td><td class="num">'+f0(mean(v))+'</td><td class="num">'+
        (v.length? f0(Math.min.apply(null,v)):"–")+'</td><td class="num">'+v.length+'/'+part.length+'</td></tr>'; }).join("");
    body='<div class="card">'+'<div class="tiles">'+
        tile(t("r_mean"),f0(su.main),"ms")+tile(t("r_best"),f0(su.best),"ms")+
        tile(t("r_sd"),f0(su.sd),"ms")+tile(t("r_caught"),su.caught+"/"+su.n,"")+
        (gb!=null? tile(t("group_avg"),f0(gb),"ms"):"")+'</div></div>'+
      '<div class="card"><h2 style="font-size:18px">'+t("r_rt")+'</h2>'+
        lineChart(pts,{unit:"ms",ref:gb,misses:miss})+'</div>'+
      '<div class="grid cols">'+
        '<div class="card"><h2 style="font-size:18px">'+t("r_left")+" / "+t("r_right")+'</h2>'+
          barChart([[t("r_left"),su.left||0],[t("r_right"),su.right||0],[t("r_top"),su.top||0]],{unit:"ms",l:90})+'</div>'+
        '<div class="card"><h2 style="font-size:18px">'+t("r_stage")+'</h2><table><thead><tr><th>'+t("r_stage")+
          '</th><th class="num">'+t("r_mean")+'</th><th class="num">'+t("r_best")+'</th><th class="num">'+t("r_caught")+
          '</th></tr></thead><tbody>'+tiers+'</tbody></table></div></div>';
  } else if(s.type==="shuttle"){
    var sp=(s.samples||[]), vel=[];
    for(var i=3;i<sp.length;i++){ var dt=sp[i][0]-sp[i-3][0];
      if(dt>0.05) vel.push([sp[i][0], Math.abs(sp[i][1]-sp[i-3][1])/dt]); }
    var marks=[], acc=0;
    (s.splits||[]).forEach(function(x,i){ acc+=x; if(i<s.splits.length-1) marks.push(acc); });
    var peak=vel.length? Math.max.apply(null,vel.map(function(v){return v[1];})):null;
    var rows=(s.splits||[]).map(function(x,i){ return '<tr><td>'+(i+1)+'</td><td class="num">'+f2(x)+
      '</td><td class="num">'+f2(s.legLen/x)+'</td><td class="num">'+f1((s.legLen/x)*3.6)+'</td></tr>'; }).join("");
    body='<div class="card"><div class="tiles">'+
        tile(t("s_time"),f2(s.time),"s")+tile(t("s_speed"),f2(su.speed),"m/s")+
        tile("km/h",f1(su.speed*3.6),"")+(peak? tile(t("s_peak"),f2(peak),"m/s"):"")+
        (gb!=null? tile(t("group_avg"),f2(gb),"s"):"")+'</div></div>'+
      '<div class="card"><h2 style="font-size:18px">'+t("s_curve")+' (m/s)</h2>'+
        lineChart(vel,{unit:"m/s",dec:1,xdec:1,noDots:true,marks:marks,zero:true})+'</div>'+
      '<div class="card"><h2 style="font-size:18px">'+t("s_splits")+'</h2><table><thead><tr><th>'+t("s_leg")+
        '</th><th class="num">'+t("s_time")+' (s)</th><th class="num">m/s</th><th class="num">km/h</th></tr></thead><tbody>'+
        rows+'</tbody></table></div>';
  } else {
    var bars=s.attempts.map(function(a,i){ return [t("j_att")+" "+(i+1), a.h, a.h===su.main]; });
    var rws=s.attempts.map(function(a,i){ return '<tr><td>'+(i+1)+'</td><td class="num">'+f2(a.t)+'</td><td class="num">'+
      f1(a.h)+'</td><td class="num">'+f2(G*a.t/2)+'</td>'+
      (p.weight? '<td class="num">'+Math.round(60.7*a.h+45.3*p.weight-2055)+'</td>':'')+'</tr>'; }).join("");
    body='<div class="card"><div class="tiles">'+
        tile(t("j_height"),f1(su.main),"cm")+tile(t("j_flight"),f2(su.flight),"s")+
        tile(t("j_takeoff"),f2(su.flight? G*su.flight/2:null),"m/s")+tile(t("r_mean"),f1(su.mean),"cm")+
        tile(t("r_sd"),f1(su.sd),"cm")+

function groupRows(g, ty){
  var rows=g.members.map(function(id){ var a=athlete(id); if(!a) return null;
    return {a:a, v:bestValue(ty,id)}; }).filter(Boolean);
  var done=rows.filter(function(x){return x.v!=null;});
  done.sort(function(x,y){ return ty==="jump"? y.v-x.v : x.v-y.v; });
  var top=done.length? done[0].v:null;
  done.forEach(function(x,i){ x.rank=i+1;
    x.score= top? Math.round(200*(ty==="jump"? x.v/top : top/x.v))/10 : null; });
  return {rows:rows, done:done};
}

/* ===================== tracking engine ===================== */
var Engine=(function(){
  var vid=document.getElementById("vid");
  var det=null, state=0, stream=null, running=false, cb=null;
  var mcv=document.createElement("canvas"), mx=mcv.getContext("2d",{willReadFrequently:true});
  mcv.width=160; mcv.height=120; var prev=null;
  var fps=0, lastT=0, frames=0, fpsT=0;
  var KP={nose:0,lw:9,rw:10,lh:11,rh:12,la:15,ra:16};

  function load(){
    if(state) return;
    state=1; engineLabel();
    if(!window.poseDetection||!window.tf){ state=3; engineLabel(); return; }
    tf.setBackend("webgl").then(function(){
      return poseDetection.createDetector(poseDetection.SupportedModels.MoveNet,
        {modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING});
    }).then(function(d){ det=d; state=2; engineLabel(); })
      .catch(function(){ state=3; engineLabel(); });
  }
  function camera(facing){
    return navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},
      width:{ideal:1280},height:{ideal:720},frameRate:{ideal:60}},audio:false})
      .then(function(s){ stream=s; vid.srcObject=s; return vid.play(); });
  }
  function stop(){
    running=false;
    if(stream){ stream.getTracks().forEach(function(x){x.stop();}); stream=null; vid.srcObject=null; }
  }
  function motionPoint(){
    if(!vid.videoWidth) return null;
    mx.drawImage(vid,0,0,160,120);
    var d=mx.getImageData(0,0,160,120).data, cur=new Uint8ClampedArray(160*120), i,p;
    for(i=0,p=0;i<d.length;i+=4,p++) cur[p]=(d[i]*77+d[i+1]*150+d[i+2]*29)>>8;
    var out=null;
    if(prev){ var sx=0,sy=0,n=0;
      for(var y=0;y<120;y+=2){ var row=y*160;
        for(var x=0;x<160;x+=2){ var df=cur[row+x]-prev[row+x]; if(df<0) df=-df;
          if(df>20){ sx+=x; sy+=y; n++; } } }
      if(n>10) out={x:sx/n/160, y:sy/n/120, score:Math.min(1,n/200)};
    }
    prev=cur; return out;
  }
  function frame(now, meta){
    if(!running) return;
    /* one clock for everything: page time in seconds, same base the games use */
    var tt = (now!=null? now : performance.now())/1000;
    frames++; if(now-fpsT>500){ fps=frames*1000/(now-fpsT); frames=0; fpsT=now; }
    if(det && vid.videoWidth){
      det.estimatePoses(vid,{maxPoses:1,flipHorizontal:false}).then(function(poses){
        var kp=null;
        if(poses&&poses[0]&&poses[0].keypoints){
          kp={}; var ks=poses[0].keypoints;
          Object.keys(KP).forEach(function(nm){
            var k=ks[KP[nm]];
            if(k) kp[nm]={x:k.x/vid.videoWidth, y:k.y/vid.videoHeight, s:k.score==null?1:k.score};
          });
        }
        if(cb) cb({t:tt, kp:kp, mode:"pose", fps:fps});
        next();
      }).catch(function(){ if(cb) cb({t:tt,kp:null,mode:"pose",fps:fps}); next(); });
    } else {
      var m=motionPoint();
      if(cb) cb({t:tt, point:m, mode:"motion", fps:fps});
      next();
    }
  }
  function next(){
    if(!running) return;
    if(vid.requestVideoFrameCallback) vid.requestVideoFrameCallback(frame);
    else requestAnimationFrame(function(n){ frame(n,null); });
  }
  function start(facing, onFrame){
    cb=onFrame;
    return camera(facing).then(function(){ running=true; prev=null; fpsT=performance.now(); next(); });
  }
  return {load:load, start:start, stop:stop, video:vid,
    get state(){return state;}, get mode(){return det? "pose":"motion";}, get fps(){return fps;}};
})();
Engine.load();

/* ===================== GAME 1: spider reaction ===================== */
var ReactGame=(function(){
  var LAYOUT=[[0.015,0.05,0.30,0.21],[0.35,0.05,0.30,0.21],[0.685,0.05,0.30,0.21],
              [0.015,0.32,0.21,0.23],[0.015,0.60,0.21,0.23],[0.775,0.32,0.21,0.23],[0.775,0.60,0.21,0.23]];
  var FLIES=30, MINRT=0.25;
  var st="idle", t0=0, idx=0, cur=-1, last=-1, limit=3, trials=[], human=0, spid=0;
  var flash=[], flashC=[], hands=[], nextAt=0, motionBase=new Float32Array(7), motionNow=new Float32Array(7), mprev=null;
  var mcv=document.createElement("canvas"), mx=mcv.getContext("2d",{willReadFrequently:true});
  mcv.width=160; mcv.height=120;
  function rct(i){ var L=LAYOUT[i]; return {x:L[0]*W,y:L[1]*H,w:L[2]*W,h:L[3]*H,cx:(L[0]+L[2]/2)*W,cy:(L[1]+L[3]/2)*H}; }
  function inBox(i,x,y){ var L=LAYOUT[i]; return x>=L[0]&&x<=L[0]+L[2]&&y>=L[1]&&y<=L[1]+L[3]; }
  function setSt(s){ st=s; t0=performance.now()/1000; }
  return {
    facing:"user", orient:"portrait", useAB:false, useFeet:false,
    init:function(){ trials=[]; idx=0; cur=-1; last=-1; human=0; spid=0; hands=[];
      bigNum.textContent=""; bigSub.textContent=t("r_hint"); stateChip.textContent=t("g_react");
      setBtns(t("start"),null); setSt("idle"); },
    main:function(){ if(st==="idle"||st==="end"){ trials=[]; idx=0; human=0; spid=0; setBtns(null,null); bigSub.textContent=""; bigNum.textContent=""; setSt("count"); } },
    alt:function(){ this.finish(); },
    sample:function(f){
      hands=[];
      if(f.mode==="pose"&&f.kp){
        ["lw","rw"].forEach(function(k){ var p=f.kp[k]; if(p&&p.s>0.3) hands.push(p); });
      } else if(f.mode==="motion"){
        /* motion fallback: per-box difference */
        if(vid.videoWidth){
          mx.save(); mx.scale(-1,1); mx.drawImage(vid,-160,0,160,120); mx.restore();
          var d=mx.getImageData(0,0,160,120).data, cur8=new Uint8ClampedArray(160*120), i,p;
          for(i=0,p=0;i<d.length;i+=4,p++) cur8[p]=(d[i]*77+d[i+1]*150+d[i+2]*29)>>8;
          if(mprev){ for(var b=0;b<7;b++){ var L=LAYOUT[b], x0=(L[0]*160)|0,y0=(L[1]*120)|0,
              x1=((L[0]+L[2])*160)|0,y1=((L[1]+L[3])*120)|0,s=0,n=0;
            for(var y=y0;y<y1;y+=2){ var row=y*160; for(var x=x0;x<x1;x+=2){ var df=cur8[row+x]-mprev[row+x]; s+=df<0?-df:df; n++; } }
            motionNow[b]= n? s/n:0; } }
          mprev=cur8;
        }
      }
      if(st==="fly"){
        var e=f.t - flyT0, caught=false;
        if(f.mode==="pose"){
          hands.forEach(function(h){ if(inBox(cur, 1-h.x, h.y)) caught=true; });   /* mirrored view */
        } else {
          if(motionNow[cur] > Math.max(12, motionBase[cur]*3+5)) caught=true;
          motionBase[cur]=motionBase[cur]*0.9+motionNow[cur]*0.1;
        }
        if(e>MINRT && caught) this.caught(e);
        else if(e>=limit) this.missed();
      }
    },
    caught:function(e){
      human++; trials.push({box:cur,limit:limit,rt:Math.round(e*1000)});
      flash[cur]=performance.now()/1000+0.35; flashC[cur]="#43D17F";
      beep(920,0.1,0.16); bigNum.textContent=Math.round(e*1000)+" ms"; setSt("caught");
    },
    missed:function(){
      spid++; trials.push({box:cur,limit:limit,rt:null});
      flash[cur]=performance.now()/1000+1.0; flashC[cur]="#FF6B75";
      beep(240,0.18,0.16); bigNum.textContent="✖"; setSt("steal");
    },
    endTurn:function(){
      cur=-1;
      if(idx>=FLIES) this.finish();
      else { setSt("wait"); nextAt=performance.now()/1000+0.5; }
    },
    finish:function(){
      setSt("end"); setBtns(t("again"), t("finish"));
      var s=saveSession({type:"react", trials:trials.slice()});
      var su=summary(s);
      bigNum.textContent=f0(su.main)+" ms";
      bigSub.innerHTML=(human>spid? "\u{1F3C6} "+t("r_win"):(spid>human? "\u{1F577}️ "+t("r_lose"):t("r_draw")))+
        "<br>"+t("r_caught")+" "+human+" / "+t("r_missed")+" "+spid;
      goBtn.onclick=function(){ ReactGame.init(); ReactGame.main(); };
      altBtn.onclick=function(){ closeRun(); go(activeGroup?"group":"coach", activeGroup); };
    },
    close:function(){ setBtns(null,null); goBtn.onclick=function(){ if(Game&&Game.main) Game.main(); };
      altBtn.onclick=function(){ if(Game&&Game.alt) Game.alt(); }; },
    draw:function(){
      var now=performance.now()/1000, e=now-t0, base=Math.min(W,H);
      drawVideo(true);
      for(var i=0;i<7;i++){
        var r=rct(i); ctx.save();
        var fl=flash[i]&&now<flash[i]? flashC[i]:null;
        if(fl){ ctx.shadowColor=fl; ctx.shadowBlur=36*dpr; }
        else if(i===cur&&st==="fly"){ ctx.shadowColor="#FFD35C"; ctx.shadowBlur=26*dpr; }
        ctx.globalAlpha=fl?1:0.92; ctx.drawImage(IMG.web,r.x,r.y,r.w,r.h); ctx.restore();
      }
      if(st==="count"){
        if(e<3){ lab(t("stand_center"),W/2,H*0.42,base*0.05,"#fff"); lab(String(3-Math.floor(e)),W/2,H*0.52,base*0.14,"#FFD35C"); }
        else { beep(1000,0.3,0.24); setSt("wait"); nextAt=now+0.6; }
      } else if(st==="wait"){ if(now>=nextAt) spawn(); }
      if(st==="fly"&&cur>=0){
        var rr=rct(cur), k=Math.min(1,(now-flyT0)/0.15);
        fitImg(IMG.fly, rr.cx+Math.sin(now*9)*rr.w*0.06, rr.cy+Math.cos(now*7)*rr.h*0.05, rr.w*0.5, rr.h*0.5, Math.sin(now*12)*0.2, k);
        lab(String(Math.max(1,Math.ceil(limit-(now-flyT0)))), rr.cx, rr.y-base*0.03, base*0.06,"#FFD35C");
      }
      if(st==="caught"&&cur>=0){
        var rc=rct(cur), kc=Math.min(1,e/0.4);
        fitImg(IMG.fly, rc.cx, rc.cy-kc*rc.h*0.6, rc.w*0.5, rc.h*0.5, kc*8, 1-kc);
        lab("+1", rc.cx, rc.cy-base*0.05-kc*base*0.04, base*0.05, "#63E39B");
        if(kc>=1) this.endTurn();
      }
      if(st==="steal"&&cur>=0){
        var rs=rct(cur), DOWN=0.5, UP=0.6, sy, fy;
        if(e<DOWN){ var kd=1-(1-e/DOWN)*(1-e/DOWN); sy=-H*0.12+(rs.cy+H*0.12)*kd; fy=rs.cy; }
        else { var ku=Math.min(1,(e-DOWN)/UP); ku=ku*ku; sy=rs.cy+(-H*0.18-rs.cy)*ku; fy=sy+rs.h*0.32; }
        ctx.save(); ctx.strokeStyle="rgba(255,255,255,.85)"; ctx.lineWidth=2.5*dpr;
        ctx.beginPath(); ctx.moveTo(rs.cx,0); ctx.lineTo(rs.cx,sy); ctx.stroke(); ctx.restore();
        fitImg(IMG.fly, rs.cx+(e<DOWN? Math.sin(now*26)*rs.w*0.08:0), fy, rs.w*0.44, rs.h*0.44, 0, 1);
        fitImg(IMG.spider, rs.cx, sy, rs.w*0.95, rs.h*0.95, Math.sin(now*9)*0.08, 1);
        if(e>=DOWN+UP) this.endTurn();
      }
      /* hand markers */
      hands.forEach(function(h){
        var x=(1-h.x)*W, y=h.y*H;
        ctx.fillStyle="rgba(99,227,155,.28)"; ctx.beginPath(); ctx.arc(x,y,base*0.045,0,7); ctx.fill();
        ctx.fillStyle="#63E39B"; ctx.beginPath(); ctx.arc(x,y,base*0.018,0,7); ctx.fill();
      });
      lab("▶ "+human+" : "+spid+" \u{1F577}️", W/2, H*0.16, base*0.045,"#fff");
      lab(idx+" / "+FLIES, W/2, H*0.20, base*0.03,"#D8CCEE");
    }
  };
  function spawn(){
    var i; do{ i=(Math.random()*7)|0; }while(i===last);
    cur=i; last=i; limit= idx<10?3:(idx<20?2:1); idx++;
    motionBase[i]=motionNow[i]; flyT0=performance.now()/1000; setSt("fly");
  }
})();
var flyT0=0;

/* ===================== GAME 2: leopard shuttle ===================== */
var ShuttleGame=(function(){
  var legLen=5, legN=3;
  var st="idle", t0=0, startSide=0, legDone=0, lastLegT=0, splits=[], samples=[], target=6, lastX=null, lost=0;
  function metres(x){ var span=lineB-lineA; if(Math.abs(span)<0.05) return 0;
    return Math.max(-1,Math.min(legLen+1,(x-lineA)/span*legLen)); }
  function legTarget(){ var even=(legDone%2)===0; return startSide===0? (even?legLen:0) : (even?0:legLen); }
  function covered(m){ return legDone*legLen + Math.max(0,Math.min(legLen, Math.abs(m-(legLen-legTarget())))); }
  function setSt(s){ st=s; t0=performance.now()/1000; }
  function leoCovered(e){
    var total=legLen*legN, legT=target/legN, leg=Math.min(legN-1,Math.floor(e/legT)), p=(e-leg*legT)/legT;
    var eased=p<0.5? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
    return Math.min(total, leg*legLen+eased*legLen);
  }
  return {
    facing:"environment", orient:"landscape", useAB:true, useFeet:false,
    init:function(){
      splits=[]; samples=[]; legDone=0; lastLegT=0; lastX=null; lost=0;
      var list=ofAthlete("shuttle",curAthlete.id);
      var b=list.length? Math.min.apply(null,list.map(function(s){return s.time;})):null;
      target = b? b*Math.max(0.92,1.06-0.03*Math.max(0,list.length-1)) : legLen*legN*0.42+1.8;
      stateChip.textContent=legN+"×"+legLen+" m";
      bigNum.textContent="0.00"; bigSub.textContent=t("calib_ab");
      setBtns(t("ready"),null); setSt("setup");
    },
    main:function(){ if(st==="setup"||st==="end"){ this.init(); setBtns(null,t("stop")); setSt("count"); } },
    alt:function(){ if(st==="race") this.finish(performance.now()/1000-t0); },
    sample:function(f){
      var x=null;
      if(f.mode==="pose"&&f.kp){
        var a=[f.kp.la,f.kp.ra,f.kp.lh,f.kp.rh].filter(function(k){return k&&k.s>0.3;});
        if(a.length) x=mean(a.map(function(k){return k.x;}));
      } else if(f.point) x=f.point.x;
      if(x==null){ lost++; return; }
      lastX=lastX==null? x : lastX*0.35+x*0.65;
      if(st!=="race") return;
      var e=f.t-raceT0, m=metres(lastX);
      samples.push([+e.toFixed(3), +covered(m).toFixed(3)]);
      if(samples.length>1400) samples.splice(0,samples.length-1400);
      if(Math.abs(m-legTarget())<=0.45 && (e-lastLegT)>0.45){
        splits.push(+(e-lastLegT).toFixed(3)); lastLegT=e; legDone++;
        beep(legDone>=legN?1000:760,0.1,0.18);
        stateChip.textContent=t("s_leg")+" "+Math.min(legDone+1,legN)+"/"+legN;
        if(legDone>=legN) this.finish(e);
      }
    },
    finish:function(time){
      if(st!=="race") return;
      setSt("end"); setBtns(t("again"),t("finish"));
      var s=saveSession({type:"shuttle", legs:legN, legLen:legLen, time:+time.toFixed(3),
        splits:splits.slice(), samples:samples.slice(), target:target, beat:time<=target, lost:lost});
      var sp=(legN*legLen)/time;
      bigNum.textContent=time.toFixed(2);
      bigSub.innerHTML=(time<=target? "\u{1F3C6} "+t("s_win"):"\u{1F406} "+t("s_lose"))+"<br>"+
        sp.toFixed(2)+" m/s · "+(sp*3.6).toFixed(1)+" km/h<br>"+splits.map(function(x){return x.toFixed(2);}).join(" · ");
      goBtn.onclick=function(){ ShuttleGame.init(); ShuttleGame.main(); };
      altBtn.onclick=function(){ closeRun(); go(activeGroup?"group":"coach", activeGroup); };
    },
    close:function(){ setBtns(null,null); goBtn.onclick=function(){ if(Game&&Game.main) Game.main(); };
      altBtn.onclick=function(){ if(Game&&Game.alt) Game.alt(); }; },
    draw:function(){
      var now=performance.now()/1000, e=now-t0;
      drawVideo(false);
      /* lane strip on top */
      var laneH=H*0.26, m1=W*0.08, m2=W*0.92;
      ctx.save(); ctx.fillStyle="rgba(12,8,20,.55)"; ctx.fillRect(0,0,W,laneH);
      ctx.strokeStyle="rgba(255,214,120,.9)"; ctx.lineWidth=3*dpr;
      [m1,m2].forEach(function(x){ ctx.beginPath(); ctx.moveTo(x,laneH*0.30); ctx.lineTo(x,laneH*0.95); ctx.stroke(); });
      var lc = st==="race"? leoCovered(now-raceT0) : (st==="end"? legLen*legN:0);
      var lLeg=Math.min(legN-1,Math.floor(lc/legLen)), lIn=(lc-lLeg*legLen)/legLen;
      var lx=(lLeg%2===0)? m1+(m2-m1)*lIn : m2-(m2-m1)*lIn;
      var im=IMG["leo"+(Math.floor(now*11)%4)];
      fitImg(im, lx, laneH*0.66, (m2-m1)*0.28, laneH*0.6, 0, 1, lLeg%2===1);
      /* athlete marker on the lane */
      if(st==="race"||st==="end"){
        var ac=samples.length? samples[samples.length-1][1]:0;
        var aLeg=Math.min(legN-1,Math.floor(ac/legLen)), aIn=(ac-aLeg*legLen)/legLen;
        var ax=(aLeg%2===0)? m1+(m2-m1)*aIn : m2-(m2-m1)*aIn;
        ctx.fillStyle="#FF3B3B"; ctx.beginPath(); ctx.arc(ax,laneH*0.22,laneH*0.09,0,7); ctx.fill();
        ctx.strokeStyle="#fff"; ctx.lineWidth=2*dpr; ctx.stroke();
        var gap=ac-lc;
        ctx.fillStyle= gap>=0? "#8CE7B0":"#FFAFA8"; ctx.font="800 "+(H*0.045)+"px Inter, sans-serif"; ctx.textAlign="right";
        ctx.fillText((gap>=0?"+":"")+gap.toFixed(1)+" m", W-12*dpr, laneH*0.28);
      }
      ctx.restore();
      /* A/B lines on the camera */
      ctx.save(); ctx.strokeStyle="rgba(255,214,120,.85)"; ctx.lineWidth=3*dpr; ctx.setLineDash([10*dpr,8*dpr]);
      [lineA,lineB].forEach(function(v){ ctx.beginPath(); ctx.moveTo(v*W,laneH); ctx.lineTo(v*W,H); ctx.stroke(); });
      ctx.setLineDash([]); ctx.restore();
      /* athlete dot */
      if(lastX!=null){
        var px=lastX*W;
        ctx.fillStyle="rgba(255,59,59,.22)"; ctx.beginPath(); ctx.arc(px,H*0.62,H*0.06,0,7); ctx.fill();
        ctx.fillStyle="#FF3B3B"; ctx.beginPath(); ctx.arc(px,H*0.62,H*0.026,0,7); ctx.fill();
        ctx.strokeStyle="#fff"; ctx.lineWidth=3*dpr; ctx.stroke();
        ctx.strokeStyle="rgba(255,59,59,.5)"; ctx.lineWidth=2*dpr;
        ctx.beginPath(); ctx.moveTo(px,laneH); ctx.lineTo(px,H); ctx.stroke();
        lab(metres(lastX).toFixed(1)+" m", px, H*0.52, H*0.05, "#fff");
      }
      if(st==="count"){
        if(e<3){ bigNum.textContent=String(3-Math.floor(e)); bigSub.textContent=t("get_ready");
          if(Math.abs(e-Math.floor(e))<0.03) beep(660,0.1,0.18); }
        else { beep(1000,0.4,0.26); startSide=(lastX!=null&&metres(lastX)>legLen/2)?1:0;
          setSt("race"); raceT0=performance.now()/1000; lastLegT=0;
          stateChip.textContent=t("s_leg")+" 1/"+legN; }
      } else if(st==="race"){
        bigNum.textContent=(now-raceT0).toFixed(2); bigSub.textContent= lastX==null? t("lost"):t("s_run");
        if(now-raceT0>60) this.finish(now-raceT0);
      }
    }
  };
})();
var raceT0=0;

/* ===================== GAME 3: kangaroo jump ===================== */
var JumpGame=(function(){
  var st="idle", t0=0, attempts=[], attempt=0, target=14, baseY=null, prevY=null, prevT=0, tOff=0, lastH=null, kangaT=0;
  var refFrame=null, noise=0, nS=0, diff=0, hi=0, lo=0, bodyH=0.4;
  var mcv=document.createElement("canvas"), mx=mcv.getContext("2d",{willReadFrequently:true});
  mcv.width=160; mcv.height=120;
  function setSt(s){ st=s; t0=performance.now()/1000; }
  function grab(){
    if(!vid.videoWidth) return null;
    mx.drawImage(vid,0,0,160,120);
    var d=mx.getImageData(0,0,160,120).data, g=new Uint8ClampedArray(160*120), i,p;
    for(i=0,p=0;i<d.length;i+=4,p++) g[p]=(d[i]*77+d[i+1]*150+d[i+2]*29)>>8;
    return g;
  }
  function bandDiff(cur){
    if(!refFrame||!cur) return 0;
    var y0=Math.max(0,((feetY-0.16)*120)|0), y1=Math.min(120,((feetY+0.02)*120)|0), s=0,n=0;
    for(var y=y0;y<y1;y++){ var row=y*160; for(var x=30;x<130;x+=2){ var df=cur[row+x]-refFrame[row+x]; s+=df<0?-df:df; n++; } }
    return n? s/n:0;
  }
  return {
    facing:"environment", orient:"portrait", useAB:false, useFeet:true,
    init:function(){
      attempts=[]; attempt=0; lastH=null; baseY=null;
      var list=ofAthlete("jump",curAthlete.id);
      var b=list.length? Math.max.apply(null,list.map(function(s){return summary(s).main;})):null;
      target = b? Math.min(b*1.25, b*(0.97+0.03*Math.max(1,list.length))) : 14;
      stateChip.textContent=t("j_att")+" 0/3";
      bigNum.textContent=""; bigSub.textContent=t("calib_feet");
      setBtns(t("ready"),null); setSt("setup");
    },
    main:function(){ if(st==="setup"||st==="result"){ refFrame=null; noise=0; nS=0; hi=0; lo=0; prevY=null;
      setBtns(null,null); setSt("set"); } },
    alt:function(){ this.finishTest(); },
    sample:function(f){
      if(f.mode==="pose"&&f.kp){
        var ank=[f.kp.la,f.kp.ra].filter(function(k){return k&&k.s>0.3;});
        var y = ank.length? Math.max.apply(null,ank.map(function(k){return k.y;})) : null;
        var nose=f.kp.nose;
        if(y!=null&&nose&&nose.s>0.3) bodyH=Math.max(0.15, y-nose.y);
        if(y==null) return;
        if(st==="set"){ baseY = baseY==null? y : baseY*0.8+y*0.2; }
        else if(st==="armed"||st==="flight"){
          var thr = baseY - bodyH*0.05;                       /* feet clearly above standing level */
          if(st==="armed" && y<thr && prevY!=null && prevY>=thr){
            tOff = interp(prevT, prevY, f.t, y, thr); setSt("flight");
          } else if(st==="flight" && y>=thr && prevY!=null && prevY<thr){
            var tLand=interp(prevT, prevY, f.t, y, thr);
            this.landed(tLand-tOff);
          }
        }
        prevY=y; prevT=f.t;
      } else {
        var cur=grab();
        if(st==="set"){ if(!refFrame&&cur) refFrame=cur; else if(cur){ var d0=bandDiff(cur); noise=(noise*nS+d0)/(nS+1); nS++; } }
        else if(st==="armed"||st==="flight"){
          diff=cur? bandDiff(cur):0;
          if(st==="armed"){ if(diff>Math.max(14,noise*3.5+6)){ hi++; if(hi>=2){ tOff=f.t; setSt("flight"); lo=0; } } else hi=0; }
          else { if(diff<Math.max(8,noise*2+3)){ lo++; if(lo>=2) this.landed(f.t-tOff); } else lo=0; }
        }
      }
    },
    landed:function(flight){
      if(flight<0.12||flight>1.4){ bigSub.textContent=t("j_invalid"); setSt("result"); this.buttons(); return; }
      var h=G*flight*flight/8*100;
      attempts.push({t:+flight.toFixed(3), h:+h.toFixed(1)}); attempt++; lastH=h; kangaT=performance.now()/1000;
      bigNum.textContent=f1(h)+" cm"; bigSub.textContent=f2(flight)+" s · "+f2(G*flight/2)+" m/s";
      beep(h>=target?900:480,0.22,0.2);
      stateChip.textContent=t("j_att")+" "+attempt+"/3";
      setSt("result"); this.buttons();
    },
    buttons:function(){
      if(attempt>=3){ setBtns(null,t("finish"));
        var b=Math.max.apply(null,attempts.map(function(a){return a.h;}));
        bigSub.innerHTML=(b>=target? "\u{1F3C6} "+t("j_win"):"\u{1F998} "+t("j_lose"))+"<br>"+t("r_best")+": "+f1(b)+" cm";
        altBtn.onclick=function(){ JumpGame.finishTest(); };
      } else { setBtns(t("next_try"),null); goBtn.onclick=function(){ JumpGame.main(); }; }
    },
    finishTest:function(){
      if(attempts.length) saveSession({type:"jump", attempts:attempts.slice(), target:target,
        beat:Math.max.apply(null,attempts.map(function(a){return a.h;}))>=target, style:"hands_on_hips"});
      closeRun(); go(activeGroup?"group":"coach", activeGroup);
    },
    close:function(){ setBtns(null,null); goBtn.onclick=function(){ if(Game&&Game.main) Game.main(); };
      altBtn.onclick=function(){ if(Game&&Game.alt) Game.alt(); }; },
    draw:function(){
      var now=performance.now()/1000, e=now-t0;
      drawVideo(false);
      if(st==="set"){
        if(e<1.6){ bigNum.textContent="…"; bigSub.textContent=t("get_ready"); }
        else { beep(1000,0.35,0.26); bigNum.textContent="↑"; bigSub.textContent=t("j_jump"); setSt("armed"); }
      } else if(st==="armed"){
        bigSub.textContent=t("j_wait");
        if(e>12){ bigSub.textContent=t("j_invalid"); setSt("result"); this.buttons(); }
      } else if(st==="flight"){
        bigNum.textContent=Math.round((now-tOff)*1000)+" ms";
      }
      /* scale + kangaroo */
      var sx=W*0.13, top=H*0.17, bot=H*(feetY-0.02), maxCm=Math.max(50,target*1.5,(lastH||0)*1.3);
      var yFor=function(cm){ return bot-(bot-top)*(cm/maxCm); };
      ctx.save();
      ctx.strokeStyle="rgba(255,255,255,.5)"; ctx.lineWidth=2*dpr;
      ctx.beginPath(); ctx.moveTo(sx,top); ctx.lineTo(sx,bot); ctx.stroke();
      ctx.font="700 "+(H*0.018)+"px Inter, sans-serif"; ctx.fillStyle="rgba(255,255,255,.75)"; ctx.textAlign="right";
      for(var cm=0;cm<=maxCm;cm+=10){ var y=yFor(cm);
        ctx.beginPath(); ctx.moveTo(sx-7*dpr,y); ctx.lineTo(sx+7*dpr,y); ctx.stroke();
        ctx.fillText(cm+"",sx-11*dpr,y+4*dpr); }
      var ty=yFor(target);
      ctx.strokeStyle="#F0BE5E"; ctx.lineWidth=3*dpr; ctx.setLineDash([10*dpr,7*dpr]);
      ctx.beginPath(); ctx.moveTo(sx,ty); ctx.lineTo(W*0.62,ty); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle="#F0BE5E"; ctx.textAlign="left"; ctx.font="800 "+(H*0.022)+"px Inter, sans-serif";
      ctx.fillText("\u{1F998} "+f1(target)+" cm", sx+10*dpr, ty-8*dpr);
      if(lastH!=null){ var ly=yFor(lastH);
        ctx.strokeStyle= lastH>=target? "#63E39B":"#FF6B75"; ctx.lineWidth=4*dpr;
        ctx.beginPath(); ctx.moveTo(sx,ly); ctx.lineTo(W*0.62,ly); ctx.stroke();
        ctx.fillStyle=ctx.strokeStyle; ctx.fillText(f1(lastH)+" cm", sx+10*dpr, ly-8*dpr); }
      var kp=0, kl=0;
      if(st==="flight"){ kp=2; kl=1; }
      else if(st==="result"&&(now-kangaT)<1.1){ var kk=(now-kangaT)/1.1; kp= kk<0.2?1:(kk<0.75?2:3); kl=Math.sin(Math.min(1,kk/0.75)*Math.PI); }
      else kp=(Math.floor(now*2)%6===0)?1:0;
      var im=IMG["kan"+kp];
      if(im&&im.width){ var kh=H*0.24, kw=im.width/im.height*kh;
        ctx.drawImage(im, Math.max(W*0.55,W-kw-W*0.05), bot-kh-(bot-ty)*kl, kw, kh); }
      ctx.restore();
    }
  };
  function interp(t1,y1,t2,y2,thr){ if(y2===y1) return t2; return t1+(thr-y1)*(t2-t1)/(y2-y1); }
})();

function drawVideo(mirror){
  if(!vid.videoWidth){ ctx.fillStyle="#0B0813"; ctx.fillRect(0,0,W,H); return; }
  var s=Math.max(W/vid.videoWidth,H/vid.videoHeight), dw=vid.videoWidth*s, dh=vid.videoHeight*s;
  ctx.save();
  if(mirror){ ctx.translate(W,0); ctx.scale(-1,1); }
  ctx.drawImage(vid,(W-dw)/2,(H-dh)/2,dw,dh);
  ctx.restore();
}
window.addEventListener("resize",placeHandles);
applyLang(); go("home");
})();
</script>
