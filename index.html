<title>Spider Reaction Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
<style>
:root{
  --bg:#F7F5FA; --surface:#FFFFFF; --surface-2:#F1ECF8; --ink:#231536; --ink-2:#5D5176; --muted:#8A7FA3;
  --line:#E2DAEF; --brand:#6D3BD6; --brand-ink:#FFFFFF; --s1:#6D3BD6; --s2:#00968C;
  --good:#1F8A4C; --bad:#C6303F; --warn:#B4690E; --gold:#FFD35C;
  --radius:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#140C22; --surface:#1E1430; --surface-2:#271A3D; --ink:#F1EAFB; --ink-2:#C6B9E0; --muted:#9A8CB8;
  --line:#352549; --brand:#8F6BF0; --brand-ink:#12071F; --s1:#8F6BF0; --s2:#12A093;
  --good:#4FD08A; --bad:#FF6B75; --warn:#E8B44A;
}}
:root[data-theme="dark"]{
  --bg:#140C22; --surface:#1E1430; --surface-2:#271A3D; --ink:#F1EAFB; --ink-2:#C6B9E0; --muted:#9A8CB8;
  --line:#352549; --brand:#8F6BF0; --brand-ink:#12071F; --s1:#8F6BF0; --s2:#12A093;
  --good:#4FD08A; --bad:#FF6B75; --warn:#E8B44A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{line-height:1.2;text-wrap:balance;margin:0}
button{font:inherit}
.hide{display:none!important}

/* ---------- shell ---------- */
#app{min-height:100%;display:flex;flex-direction:column}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:10px;align-items:center;
  padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar .name{font-weight:800;letter-spacing:.01em;margin-right:auto;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--brand)}
.page{padding:18px 16px 64px;max-width:1040px;width:100%;margin:0 auto}

/* ---------- controls ---------- */
.btn{border:1px solid transparent;border-radius:12px;background:var(--brand);color:var(--brand-ink);
  font-weight:700;padding:11px 18px;cursor:pointer;transition:filter .15s,transform .06s}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:translateY(1px)}
.btn.sec{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--line)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
select,input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:9px 11px;min-width:0}
select:focus-visible,input:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:var(--surface);color:var(--ink-2);border:0;padding:7px 11px;cursor:pointer;font-size:14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.grid{display:grid;gap:14px}
.cols{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.tile{background:var(--surface-2);border-radius:14px;padding:13px 14px}
.tile .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .v{font-size:clamp(22px,4.6vw,30px);font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.tile .u{font-size:13px;color:var(--ink-2);font-weight:600}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.num,th.num{text-align:right}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)} .small{font-size:13px}
.list{display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.item b{font-size:16px} .item .grow{flex:1;min-width:120px}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin:2px 0 6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.note{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--ink-2)}
figure{margin:0}
figcaption{font-size:13px;color:var(--muted);margin-top:6px}
.chart-wrap{overflow-x:auto}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;
  font-weight:600;padding:5px 9px;border-radius:8px;opacity:0;transition:opacity .12s}

/* ---------- game ---------- */
#gameScreen{position:fixed;inset:0;background:#0E0719;z-index:40}
#gameScreen canvas{position:absolute;inset:0;width:100%;height:100%}
#gameScreen video{position:absolute;width:1px;height:1px;opacity:0}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;text-align:center;padding:24px 16px;color:#F3ECFF;background:rgba(14,7,25,.72)}
.overlay h2{font-size:clamp(26px,7vw,42px)}
.gbtn{border:3px solid #fff;border-radius:999px;background:#D11F30;color:#fff;font-weight:800;
  letter-spacing:.06em;font-size:clamp(18px,4.5vw,26px);padding:14px 40px;min-width:min(70vw,300px);cursor:pointer}
.gbtn.sec{background:#3D2A5C}
#quit{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;z-index:3;
  background:rgba(20,10,35,.6);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:8px 12px;cursor:pointer}

@media print{
  .bar,.noprint{display:none!important}
  body{background:#fff;color:#000}
  .card{border:1px solid #bbb;break-inside:avoid;padding:12px}
  .page{padding:0;max-width:none}
  .tile{background:#f3f3f3}
}
</style>

<div id="app">
  <header class="bar noprint">
    <span class="name"><span class="dot"></span><span data-t="app"></span></span>
    <span class="seg" id="langSeg">
      <button data-lang="uz" aria-pressed="true">UZ</button>
      <button data-lang="ru" aria-pressed="false">RU</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </span>
    <button class="btn sec sm" id="navHome" data-t="nav_home"></button>
    <button class="btn sec sm" id="navCoach" data-t="nav_coach"></button>
  </header>

  <!-- HOME -->
  <main class="page" id="home">
    <div class="grid" style="gap:18px">
      <div class="card">
        <h1 style="font-size:clamp(24px,5vw,34px)" data-t="home_title"></h1>
        <p class="muted" style="margin:8px 0 0" data-t="home_sub"></p>
        <div class="row" style="margin-top:16px">
          <label class="small muted" for="playerSel" data-t="athlete"></label>
          <select id="playerSel" style="min-width:190px"></select>
          <button class="btn sec sm" id="addPlayer" data-t="add_athlete"></button>
        </div>
        <div class="row" style="margin-top:16px">
          <button class="btn" id="playBtn" data-t="play"></button>
          <button class="btn sec" id="howBtn" data-t="how"></button>
        </div>
      </div>
      <div class="card" id="lastCard"></div>
      <div class="note" data-t="privacy"></div>
    </div>
  </main>

  <!-- COACH -->
  <main class="page hide" id="coach">
    <h1 style="font-size:clamp(22px,4.6vw,30px)" data-t="coach_title"></h1>
    <p class="muted small" data-t="coach_sub"></p>
    <div class="grid" style="margin-top:16px">
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <h2 style="font-size:19px" data-t="athletes"></h2>
          <button class="btn sm" id="addPlayer2" data-t="add_athlete"></button>
        </div>
        <div class="list" id="playerList" style="margin-top:14px"></div>
      </div>
      <div class="card">
        <h2 style="font-size:19px" data-t="sessions"></h2>
        <div class="list" id="sessionList" style="margin-top:14px"></div>
      </div>
      <div class="row">
        <button class="btn sec sm" id="exportBtn" data-t="export_csv"></button>
        <button class="btn danger sm" id="wipeBtn" data-t="wipe"></button>
      </div>
    </div>
  </main>

  <!-- REPORT -->
  <main class="page hide" id="report"></main>
</div>

<!-- GAME -->
<div id="gameScreen" class="hide">
  <video id="vid" playsinline muted autoplay></video>
  <canvas id="cv"></canvas>
  <button id="quit" data-t="quit"></button>
  <div class="overlay hide" id="ovStart">
    <h2 data-t="ready_title"></h2>
    <p id="readyWho" style="font-size:18px"></p>
    <p style="max-width:34ch" data-t="ready_text"></p>
    <button class="gbtn" id="goBtn" data-t="start"></button>
  </div>
  <div class="overlay hide" id="ovEnd">
    <h2 id="endTitle"></h2>
    <p id="endLine" style="font-size:clamp(18px,4.6vw,24px);font-weight:700"></p>
    <p id="endRt" class="small" style="opacity:.85"></p>
    <button class="gbtn" id="againBtn" data-t="again"></button>
    <button class="gbtn sec" id="doneBtn" data-t="finish"></button>
  </div>
  <div class="overlay hide" id="ovErr">
    <h2 data-t="cam_title"></h2>
    <p id="camMsg" style="max-width:36ch"></p>
    <button class="gbtn" id="retryBtn" data-t="retry"></button>
    <button class="gbtn sec" id="backBtn" data-t="back"></button>
  </div>
</div>
<div id="tip" role="status"></div>

var lang = "uz";
function t(k){ return (T[lang] && T[lang][k]) || T.en[k] || k; }
function applyLang(){
  document.documentElement.lang = lang;
  [].forEach.call(document.querySelectorAll("[data-t]"), function(el){ el.textContent = t(el.getAttribute("data-t")); });
  [].forEach.call(document.querySelectorAll("#langSeg button"), function(b){
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
  });
  renderAll();
}

/* ============ storage ============ */
var KEY="spiderLab.v1";
var db = {athletes:[], sessions:[]};
function load(){
  try{ var raw = localStorage.getItem(KEY); if(raw) db = JSON.parse(raw); }catch(e){}
  if(!db.athletes) db.athletes=[]; if(!db.sessions) db.sessions=[];
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} }
load();
try{ var L=localStorage.getItem(KEY+".lang"); if(L && T[L]) lang=L; }catch(e){}

/* ============ stats ============ */
function mean(a){ return a.length ? a.reduce(function(x,y){return x+y;},0)/a.length : null; }
function median(a){ if(!a.length) return null; var s=a.slice().sort(function(x,y){return x-y;}), m=s.length>>1;
  return s.length%2 ? s[m] : (s[m-1]+s[m])/2; }
function sd(a){ if(a.length<2) return null; var m=mean(a);
  return Math.sqrt(a.reduce(function(s,x){return s+(x-m)*(x-m);},0)/(a.length-1)); }
function sideOf(box){ return box<=2 ? "top" : (box<=4 ? "left" : "right"); }
function rtsOf(tr){ return tr.filter(function(x){return x.rt!=null;}).map(function(x){return x.rt;}); }
function summarize(tr){
  var r = rtsOf(tr), n=tr.length;
  var byS = {left:[],right:[],top:[]};
  tr.forEach(function(x){ if(x.rt!=null) byS[sideOf(x.box)].push(x.rt); });
  var half = Math.max(1, Math.floor(r.length/3));
  return {
    n:n, caught:r.length, missed:n-r.length,
    mean:mean(r), best:r.length?Math.min.apply(null,r):null, worst:r.length?Math.max.apply(null,r):null,
    median:median(r), sd:sd(r),
    left:mean(byS.left), right:mean(byS.right), top:mean(byS.top),
    first:mean(r.slice(0,half)), last:mean(r.slice(-half))
  };
}
function groupMean(age, excludeId){
  var all=[];
  db.sessions.forEach(function(s){
    if(s.id===excludeId) return;
    var a = db.athletes.filter(function(p){return p.id===s.athleteId;})[0];
    if(a && a.age===age) all = all.concat(rtsOf(s.trials));
  });
  return all.length>=10 ? mean(all) : null;
}
function fmt(v,d){ return v==null ? "–" : (d?v.toFixed(d):Math.round(v)); }
function dateStr(iso){ var d=new Date(iso);
  return d.toLocaleDateString(lang==="uz"?"uz-UZ":(lang==="ru"?"ru-RU":"en-GB")) + " " +
         d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}); }

/* ============ charts (inline SVG) ============ */
var tipEl = document.getElementById("tip");
function showTip(ev, text){
  tipEl.textContent = text; tipEl.style.opacity = "1";
  tipEl.style.left = Math.min(window.innerWidth-120, ev.clientX+12)+"px";
  tipEl.style.top  = (ev.clientY-34)+"px";
}
function hideTip(){ tipEl.style.opacity="0"; }

function trendChart(trials, avg, gavg){
  var W=640,H=260,P={l:52,r:16,t:16,b:34};
  var rts = trials.map(function(x){return x.rt;});
  var vals = rts.filter(function(v){return v!=null;});
  if(!vals.length) return '<p class="muted">'+t("no_data")+'</p>';
  var all = vals.concat(gavg?[gavg]:[]);
  var maxV = Math.max.apply(null, all) * 1.08;
  var minV = Math.max(0, Math.min.apply(null, all) - (maxV - Math.min.apply(null, all)) * 0.25);
  var x = function(i){ return P.l + (W-P.l-P.r) * (trials.length<2?0.5:i/(trials.length-1)); };
  var y = function(v){ return H-P.b - (H-P.t-P.b) * ((v-minV)/(maxV-minV)); };
  var s='', pts=[], ticks=4, i;
  for(i=0;i<=ticks;i++){
    var v = minV + (maxV-minV)*i/ticks, yy=y(v);
    s += '<line x1="'+P.l+'" y1="'+yy+'" x2="'+(W-P.r)+'" y2="'+yy+'" stroke="var(--line)" stroke-width="1"/>'+
         '<text x="'+(P.l-8)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+Math.round(v)+'</text>';
  }
  trials.forEach(function(tr,i){ if(tr.rt!=null) pts.push([x(i), y(tr.rt), i, tr.rt]); });
  var path = pts.map(function(p,i){ return (i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1); }).join(" ");
  if(gavg) s += '<line x1="'+P.l+'" y1="'+y(gavg)+'" x2="'+(W-P.r)+'" y2="'+y(gavg)+'" stroke="var(--s2)" stroke-width="2" stroke-dasharray="7 5"/>';
  if(avg)  s += '<line x1="'+P.l+'" y1="'+y(avg)+'" x2="'+(W-P.r)+'" y2="'+y(avg)+'" stroke="var(--s1)" stroke-width="1.5" stroke-dasharray="3 4" opacity=".55"/>';
  s += '<path d="'+path+'" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach(function(p){
    s += '<circle class="pt" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2" '+
         'data-lbl="'+t("trial")+' '+(p[2]+1)+' — '+p[3]+' '+t("ms")+'"/>';
  });
  trials.forEach(function(tr,i){
    if(tr.rt==null) s += '<g data-lbl="'+t("trial")+' '+(i+1)+' — '+t("missed")+'"><line x1="'+(x(i)-5)+'" y1="'+(H-P.b-6)+'" x2="'+(x(i)+5)+'" y2="'+(H-P.b-16)+'" stroke="var(--bad)" stroke-width="2"/>'+
         '<line x1="'+(x(i)-5)+'" y1="'+(H-P.b-16)+'" x2="'+(x(i)+5)+'" y2="'+(H-P.b-6)+'" stroke="var(--bad)" stroke-width="2"/></g>';
  });
  [1, Math.ceil(trials.length/2), trials.length].forEach(function(n){
    s += '<text x="'+x(n-1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+n+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" role="img" style="min-width:520px">'+s+'</svg>';
}

function sideChart(s){
  var rows=[["left",s.left],["right",s.right],["top",s.top]].filter(function(r){return r[1]!=null;});
  if(!rows.length) return "";
  var W=460,H=40*rows.length+24, P={l:66,r:58,t:8};
  var max = Math.max.apply(null, rows.map(function(r){return r[1];}))*1.15;
  var out="";
  rows.forEach(function(r,i){
    var w=(W-P.l-P.r)*(r[1]/max), yy=P.t+i*40;
    out += '<text x="'+(P.l-10)+'" y="'+(yy+20)+'" text-anchor="end" font-size="13" fill="var(--ink-2)">'+t(r[0])+'</text>'+
           '<rect x="'+P.l+'" y="'+(yy+6)+'" width="'+w.toFixed(1)+'" height="22" rx="4" fill="var(--s1)" data-lbl="'+t(r[0])+' — '+Math.round(r[1])+' '+t("ms")+'"/>'+
           '<text x="'+(P.l+w+8)+'" y="'+(yy+22)+'" font-size="13" font-weight="700" fill="var(--ink)">'+Math.round(r[1])+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" role="img" style="min-width:380px">'+out+'</svg>';
}

/* ============ views ============ */
var elHome=document.getElementById("home"), elCoach=document.getElementById("coach"),
    elReport=document.getElementById("report"), elGame=document.getElementById("gameScreen");
var view="home", reportId=null;

function go(v, id){
  view=v; reportId=id||null;
  elHome.classList.toggle("hide", v!=="home");
  elCoach.classList.toggle("hide", v!=="coach");
  elReport.classList.toggle("hide", v!=="report");
  window.scrollTo(0,0);
  renderAll();
}
function renderAll(){
  renderPlayers(); renderLast();
  if(view==="coach") renderCoach();
  if(view==="report") renderReport(reportId);
}
function currentPlayerId(){ return document.getElementById("playerSel").value || null; }

function renderPlayers(){
  var sel=document.getElementById("playerSel"), keep=sel.value;
  sel.innerHTML="";
  db.athletes.forEach(function(p){
    var o=document.createElement("option"); o.value=p.id; o.textContent=p.name+" ("+p.age+")"; sel.appendChild(o);
  });
  if(!db.athletes.length){
    var o=document.createElement("option"); o.value=""; o.textContent="—"; sel.appendChild(o);
  }
  if(keep) sel.value=keep;
}
function renderLast(){
  var box=document.getElementById("lastCard");
  var s = db.sessions.slice(-1)[0];
  if(!s){ box.innerHTML='<p class="muted" style="margin:0">'+t("no_sessions")+'</p>'; return; }
  var a=db.athletes.filter(function(p){return p.id===s.athleteId;})[0], su=summarize(s.trials);
  box.innerHTML = '<div class="row" style="justify-content:space-between"><h2 style="font-size:18px">'+t("last_session")+'</h2>'+
    '<button class="btn sec sm" data-open="'+s.id+'">'+t("open")+'</button></div>'+
    '<p class="muted small" style="margin:6px 0 12px">'+(a?a.name:"?")+' · '+dateStr(s.date)+'</p>'+
    tiles(su, null);
}
function tiles(s, gavg){
  function tile(k,v,u){ return '<div class="tile"><div class="k">'+k+'</div><div class="v">'+v+'<span class="u"> '+(u||"")+'</span></div></div>'; }
  var html = tile(t("mean"), fmt(s.mean), t("ms")) + tile(t("best"), fmt(s.best), t("ms")) +
             tile(t("sd"), fmt(s.sd), t("ms")) + tile(t("caught"), s.caught+"/"+s.n, "");
  if(gavg!=null && s.mean!=null){
    var d = Math.round(gavg - s.mean);
    html += '<div class="tile"><div class="k">'+t("vs_group")+'</div><div class="v" style="color:'+(d>=0?"var(--good)":"var(--bad)")+'">'+
            (d>=0?"+":"")+d+'<span class="u"> '+t("ms")+' '+(d>=0?t("faster"):t("slower"))+'</span></div></div>';
  }
  return '<div class="tiles">'+html+'</div>';
}

function renderCoach(){
  var pl=document.getElementById("playerList");
  pl.innerHTML = db.athletes.length ? "" : '<div class="empty">'+t("no_players")+'</div>';
  db.athletes.forEach(function(p){
    var ss = db.sessions.filter(function(s){return s.athleteId===p.id;});
    var all=[]; ss.forEach(function(s){ all=all.concat(rtsOf(s.trials)); });
    var d=document.createElement("div"); d.className="item";
    d.innerHTML = '<div class="grow"><b>'+p.name+'</b><div class="small muted">'+p.age+' · '+ss.length+' '+t("sessions_n")+'</div></div>'+
      '<span class="pill">'+t("mean")+": "+fmt(mean(all))+" "+t("ms")+'</span>'+
      '<button class="btn danger sm" data-del="'+p.id+'">'+t("delete")+'</button>';
    pl.appendChild(d);
  });
  var sl=document.getElementById("sessionList");
  sl.innerHTML = db.sessions.length ? "" : '<div class="empty">'+t("no_sessions")+'</div>';
  db.sessions.slice().reverse().forEach(function(s){
    var a=db.athletes.filter(function(p){return p.id===s.athleteId;})[0], su=summarize(s.trials);
    var d=document.createElement("div"); d.className="item";
    d.innerHTML='<div class="grow"><b>'+(a?a.name:"?")+'</b><div class="small muted">'+dateStr(s.date)+'</div></div>'+
      '<span class="pill">'+fmt(su.mean)+' '+t("ms")+'</span>'+
      '<span class="pill">'+su.caught+'/'+su.n+'</span>'+
      '<button class="btn sec sm" data-open="'+s.id+'">'+t("open")+'</button>';
    sl.appendChild(d);
  });
}

function renderReport(id){
  var s = db.sessions.filter(function(x){return x.id===id;})[0];
  if(!s){ go("coach"); return; }
  var a = db.athletes.filter(function(p){return p.id===s.athleteId;})[0] || {name:"?",age:0};
  var su = summarize(s.trials), gavg = groupMean(a.age, s.id);
  var tierRows = [[0,10,3],[10,20,2],[20,30,1]].map(function(r){
    var part = s.trials.slice(r[0], r[1]), p = summarize(part);
    return '<tr><td>'+r[2]+' s</td><td class="num">'+fmt(p.mean)+'</td><td class="num">'+fmt(p.best)+'</td><td class="num">'+p.caught+'/'+p.n+'</td></tr>';
  }).join("");
  var trialRows = s.trials.map(function(x,i){
    return '<tr><td>'+(i+1)+'</td><td>'+t(sideOf(x.box))+'</td><td>'+x.limit+' s</td><td class="num">'+
      (x.rt==null ? '<span style="color:var(--bad)">'+t("missed")+'</span>' : x.rt)+'</td></tr>';
  }).join("");
  var fatigue = (su.first!=null && su.last!=null) ? Math.round(su.last - su.first) : null;

  elReport.innerHTML =
   '<div class="row noprint" style="justify-content:space-between;margin-bottom:12px">'+
     '<button class="btn sec sm" id="backCoach">← '+t("coach_title")+'</button>'+
     '<button class="btn sm" id="printBtn">'+t("print")+'</button></div>'+
   '<div class="grid">'+
     '<div class="card"><h1 style="font-size:24px">'+a.name+' · '+a.age+'</h1>'+
       '<p class="muted small" style="margin:4px 0 14px">'+dateStr(s.date)+' · '+(s.device||"")+'</p>'+
       tiles(su, gavg)+'</div>'+

     '<div class="card"><h2 style="font-size:18px">'+t("chart_trend")+' ('+t("ms")+')</h2>'+
       '<div class="legend"><span><i style="background:var(--s1)"></i>'+t("athlete_line")+'</span>'+
       (gavg?'<span><i style="background:var(--s2)"></i>'+t("group_avg")+' ('+fmt(gavg)+' '+t("ms")+')</span>':'')+
       '<span><i style="background:var(--bad)"></i>'+t("missed")+'</span></div>'+
       '<figure class="chart-wrap">'+trendChart(s.trials, su.mean, gavg)+
       '<figcaption>'+t("first")+": "+fmt(su.first)+" "+t("ms")+" · "+t("last")+": "+fmt(su.last)+" "+t("ms")+
       (fatigue!=null? " ("+(fatigue>0?"+":"")+fatigue+" "+t("ms")+")":"")+'</figcaption></figure></div>'+

     '<div class="grid cols">'+
       '<div class="card"><h2 style="font-size:18px">'+t("chart_side")+'</h2>'+sideChart(su)+'</div>'+
       '<div class="card"><h2 style="font-size:18px">'+t("tier")+'</h2>'+
         '<table><thead><tr><th>'+t("tier")+'</th><th class="num">'+t("mean")+'</th><th class="num">'+t("best")+'</th><th class="num">'+t("caught")+'</th></tr></thead>'+
         '<tbody>'+tierRows+'</tbody></table></div>'+
     '</div>'+

     '<div class="card"><h2 style="font-size:18px">'+t("table_view")+'</h2>'+
       '<table><thead><tr><th>'+t("trial")+'</th><th>'+t("side")+'</th><th>'+t("tier")+'</th><th class="num">'+t("rt")+'</th></tr></thead>'+
       '<tbody>'+trialRows+'</tbody></table></div>'+
     '<div class="note">'+t("device_note")+'</div>'+
   '</div>';
  document.getElementById("backCoach").onclick=function(){ go("coach"); };
  document.getElementById("printBtn").onclick=function(){ window.print(); };
}

document.addEventListener("click", function(e){
  var o=e.target.closest("[data-open]"); if(o){ go("report", o.getAttribute("data-open")); return; }
  var d=e.target.closest("[data-del]");
  if(d){
    var id=d.getAttribute("data-del");
    db.athletes = db.athletes.filter(function(p){return p.id!==id;});
    db.sessions = db.sessions.filter(function(s){return s.athleteId!==id;});

  }
});
function addAthlete(){
  var name = prompt(t("name_q")); if(!name) return;
  var age = parseInt(prompt(t("age_q")), 10); if(!age) age = 10;
  var p = {id:"a"+Date.now(), name:name.trim(), age:age};
  db.athletes.push(p); save(); renderPlayers();
  document.getElementById("playerSel").value = p.id;
  renderAll();
}

document.getElementById("addPlayer2").onclick = addAthlete;

document.getElementById("wipeBtn").onclick = function(){
  if(confirm(t("confirm_wipe"))){ db={athletes:[],sessions:[]}; save(); renderAll(); }
};
document.getElementById("exportBtn").onclick = function(){
  var rows=[["athlete","age","date","trial","side","limit_s","rt_ms","caught"]];
  db.sessions.forEach(function(s){
    var a=db.athletes.filter(function(p){return p.id===s.athleteId;})[0]||{name:"?",age:""};
    s.trials.forEach(function(x,i){
      rows.push([a.name,a.age,s.date,i+1,sideOf(x.box),x.limit,x.rt==null?"":x.rt,x.rt==null?0:1]);
    });
  });
  var csv = rows.map(function(r){return r.join(",");}).join("\n");
  var a=document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"}));
  a.download = "spider-reaction.csv"; a.click();
};

var art={}, artLeft=3;
Object.keys(IMG).forEach(function(k){ var im=new Image(); im.onload=im.onerror=function(){artLeft--;}; im.src=IMG[k]; art[k]=im; });

var cv=document.getElementById("cv"), ctx=cv.getContext("2d"), vid=document.getElementById("vid");
var ovStart=document.getElementById("ovStart"), ovEnd=document.getElementById("ovEnd"), ovErr=document.getElementById("ovErr");
var FLIES=30, PAUSE=0.8;
var LAYOUT=[[0.015,0.045,0.30,0.22],[0.35,0.045,0.30,0.22],[0.685,0.045,0.30,0.22],
            [0.015,0.32,0.21,0.24],[0.015,0.60,0.21,0.24],[0.775,0.32,0.21,0.24],[0.775,0.60,0.21,0.24]];
var gs="idle", t0=0, nextAt=0, idx=0, human=0, spid=0, cur=-1, lastB=-1, limit=3, trials=[], playerId=null;
var flash=[], flashCol=[], W=0,H=0,dpr=1, stream=null, loopOn=false;

var MW=160,MH=120, mcv=document.createElement("canvas"), mctx;
mcv.width=MW; mcv.height=MH; mctx=mcv.getContext("2d",{willReadFrequently:true});
var prev=null, motion=new Float32Array(7), noise=0, nSamp=0;

function sampleMotion(){
  if(!vid.videoWidth) return;
  mctx.save(); mctx.scale(-1,1); mctx.drawImage(vid,-MW,0,MW,MH); mctx.restore();
  var d=mctx.getImageData(0,0,MW,MH).data, cur8=new Uint8ClampedArray(MW*MH), i,p;
  for(i=0,p=0;i<d.length;i+=4,p++) cur8[p]=(d[i]*77+d[i+1]*150+d[i+2]*29)>>8;
  if(prev){
    for(var b=0;b<7;b++){
      var L=LAYOUT[b], x0=(L[0]*MW)|0, y0=(L[1]*MH)|0, x1=((L[0]+L[2])*MW)|0, y1=((L[1]+L[3])*MH)|0, sum=0,n=0;
      for(var y=y0;y<y1;y+=2){ var row=y*MW;
        for(var x=x0;x<x1;x+=2){ var df=cur8[row+x]-prev[row+x]; sum += df<0?-df:df; n++; } }
      motion[b]= n? sum/n : 0;
    }
  }
  prev=cur8;
}
function calib(){ var m=0,i; for(i=0;i<7;i++) m=Math.max(m,motion[i]); noise=(noise*nSamp+m)/(nSamp+1); nSamp++; }
function hit(b){ return motion[b] > Math.max(7, noise*2.5+4); }
function rct(i){ var L=LAYOUT[i];
  return {x:L[0]*W,y:L[1]*H,w:L[2]*W,h:L[3]*H,cx:(L[0]+L[2]/2)*W,cy:(L[1]+L[3]/2)*H}; }
function setG(s){ gs=s; t0=performance.now()/1000; }
function lab(txt,cx,cy,size,color){
  ctx.save(); ctx.font="800 "+size+"px Inter, system-ui, sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.lineWidth=Math.max(3,size*0.16); ctx.strokeStyle="rgba(10,5,20,.85)"; ctx.lineJoin="round"; ctx.strokeText(txt,cx,cy);
  ctx.fillStyle=color; ctx.fillText(txt,cx,cy); ctx.restore();
}
function fit(im,cx,cy,mw,mh,rot,sc){
  if(!im||!im.width) return;
  var k=Math.min(mw/im.width,mh/im.height)*(sc===undefined?1:sc), w=im.width*k, h=im.height*k;
  ctx.save(); ctx.translate(cx,cy); if(rot) ctx.rotate(rot); ctx.drawImage(im,-w/2,-h/2,w,h); ctx.restore();
}

function openGame(){
  playerId = currentPlayerId();
  if(!playerId){ alert(t("pick_athlete")); return; }
  var p = db.athletes.filter(function(x){return x.id===playerId;})[0];
  document.getElementById("readyWho").textContent = p ? p.name+" · "+p.age : "";
  elGame.classList.remove("hide");
  ovStart.classList.remove("hide"); ovEnd.classList.add("hide"); ovErr.classList.add("hide");
  setG("idle");
  if(!loopOn){ loopOn=true; requestAnimationFrame(frame); }
  startCam();
}
function startCam(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ camFail("no API"); return; }
  navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:1280},height:{ideal:720}},audio:false})
    .then(function(s){ stream=s; vid.srcObject=s; return vid.play(); })
    .catch(function(e){ camFail(e && e.name ? e.name : "error"); });
}
function camFail(msg){
  document.getElementById("camMsg").textContent = t("cam_msg")+" ("+msg+")";
  ovStart.classList.add("hide"); ovErr.classList.remove("hide");
}
function closeGame(){
  elGame.classList.add("hide");
  if(stream){ stream.getTracks().forEach(function(x){x.stop();}); stream=null; vid.srcObject=null; }
  setG("idle"); renderAll();
}
function beginRun(){
  human=0; spid=0; idx=0; cur=-1; lastB=-1; trials=[]; noise=0; nSamp=0;
  ovStart.classList.add("hide"); ovEnd.classList.add("hide");
  setG("countdown");
}
function nextFly(){ nextAt=performance.now()/1000+PAUSE; setG("wait"); }
function spawn(){
  var i; do{ i=(Math.random()*7)|0; }while(i===lastB);
  cur=i; lastB=i; limit = idx<10?3:(idx<20?2:1); idx++;
  setG("fly");
}
function finishTurn(){ cur=-1; if(idx>=FLIES) finishRun(); else nextFly(); }
function finishRun(){
  setG("done");
  var su = summarize(trials);
  var sess = {id:"s"+Date.now(), athleteId:playerId, date:new Date().toISOString(),
              device:(navigator.userAgent.indexOf("Mobi")>-1?"phone":"laptop"), trials:trials.slice()};
  db.sessions.push(sess); save();
  var tt=document.getElementById("endTitle");
  tt.textContent = human>spid ? t("win") : (spid>human ? t("lose") : t("draw"));
  tt.style.color = human>spid ? "#43D17F" : (spid>human ? "#FF6B75" : "#fff");
  document.getElementById("endLine").textContent = human+" : "+spid;
  document.getElementById("endRt").textContent = t("mean")+" "+fmt(su.mean)+" "+t("ms")+" · "+t("best")+" "+fmt(su.best)+" "+t("ms");
  ovEnd.classList.remove("hide");
}

function frame(){
  requestAnimationFrame(frame);
  if(elGame.classList.contains("hide")) return;
  var now=performance.now()/1000, e=now-t0, r, k, y, base;

  dpr=Math.min(window.devicePixelRatio||1,2);
  if(cv.width!==(cv.clientWidth*dpr|0) || cv.height!==(cv.clientHeight*dpr|0)){
    cv.width=cv.clientWidth*dpr|0; cv.height=cv.clientHeight*dpr|0;
  }
  W=cv.width; H=cv.height; base=Math.min(W,H);
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,W,H);

  if(vid.videoWidth){
    var s=Math.max(W/vid.videoWidth,H/vid.videoHeight), dw=vid.videoWidth*s, dh=vid.videoHeight*s;
    ctx.save(); ctx.translate(W,0); ctx.scale(-1,1); ctx.drawImage(vid,(W-dw)/2,(H-dh)/2,dw,dh); ctx.restore();
  } else { ctx.fillStyle="#0E0719"; ctx.fillRect(0,0,W,H); }
  sampleMotion();
  if(gs==="idle"||gs==="done") return;

  for(var i=0;i<7;i++){
    var rr=rct(i);
    ctx.save();
    var f = flash[i]&&now<flash[i] ? flashCol[i] : null;
    if(f){ ctx.shadowColor=f; ctx.shadowBlur=40*dpr; }
    else if(i===cur&&gs==="fly"){ ctx.shadowColor="#FFD35C"; ctx.shadowBlur=30*dpr; }
    ctx.globalAlpha=f?1:.93; ctx.drawImage(art.web, rr.x, rr.y, rr.w, rr.h); ctx.restore();
  }

  switch(gs){
    case "countdown":
      calib();
      if(e<3.2){ lab(t("ready_title"), W/2, H/2-base*0.1, base*0.055, "#fff");
                 lab(String(Math.max(1,3-Math.floor(e))), W/2, H/2+base*0.02, base*0.16, "#FFD35C"); }
      else if(e<3.9) lab("GO!", W/2, H/2, base*0.16, "#43D17F");
      else nextFly();
      break;
    case "wait":
      if(idx===10) lab("2 s", W/2, H/2, base*0.1, "#FFD35C");
      if(idx===20) lab("1 s", W/2, H/2, base*0.1, "#FF6B75");
      if(now>=nextAt) spawn();
      break;
    case "fly":
      r=rct(cur); k=Math.min(1,e/0.15);
      fit(art.fly, r.cx+Math.sin(now*9)*r.w*0.06, r.cy+Math.cos(now*7)*r.h*0.05, r.w*0.55, r.h*0.55, Math.sin(now*12)*0.2, k);
      lab(String(Math.max(1,Math.ceil(limit-e))), r.cx, r.y-base*0.035, base*0.07, "#FFD35C");
      if(e>0.12 && hit(cur)){
        human++; flash[cur]=now+0.4; flashCol[cur]="#43D17F";
        trials.push({box:cur, limit:limit, rt:Math.round(e*1000)});
        setG("caught");
      } else if(e>=limit){
        flash[cur]=now+0.9; flashCol[cur]="#FF6B75";
        trials.push({box:cur, limit:limit, rt:null});
        setG("down");
      }
      break;
    case "caught":
      r=rct(cur); k=Math.min(1,e/0.35);
      fit(art.fly, r.cx, r.cy-k*r.h*0.5, r.w*0.55, r.h*0.55, k*8, 1-k);
      lab(String(trials[trials.length-1].rt)+" "+t("ms"), r.cx, r.cy-base*0.075, base*0.05, "#43D17F");
      if(k>=1) finishTurn();
      break;
    case "down":
      r=rct(cur); k=Math.min(1,e/0.45); k=1-(1-k)*(1-k); y=-H*0.15+(r.cy+H*0.15)*k;
      ctx.save(); ctx.strokeStyle="rgba(255,255,255,.85)"; ctx.lineWidth=2*dpr;
      ctx.beginPath(); ctx.moveTo(r.cx,0); ctx.lineTo(r.cx,y); ctx.stroke(); ctx.restore();
      fit(art.fly, r.cx+Math.sin(now*25)*r.w*0.08, r.cy, r.w*0.55, r.h*0.55, 0, 1);
      fit(art.spider, r.cx, y, r.w*0.95, r.h*0.95, Math.sin(now*9)*0.08, 1);
      if(k>=1){ spid++; setG("up"); }
      break;
    case "up":
      r=rct(cur); k=Math.min(1,e/0.6); k=k*k; y=r.cy+(-H*0.2-r.cy)*k;
      ctx.save(); ctx.strokeStyle="rgba(255,255,255,.85)"; ctx.lineWidth=2*dpr;
      ctx.beginPath(); ctx.moveTo(r.cx,0); ctx.lineTo(r.cx,y); ctx.stroke(); ctx.restore();
      fit(art.fly, r.cx, y+r.h*0.3, r.w*0.45, r.h*0.45, 0, 1);
      fit(art.spider, r.cx, y, r.w*0.95, r.h*0.95, Math.sin(now*7)*0.06, 1);
      if(k>=1) finishTurn();
      break;
  }
  lab("▶ "+human+"  :  "+spid+" \u{1F577}", W/2, base*0.045, base*0.05, "#fff");
  lab(idx+" / "+FLIES, W/2, base*0.10, base*0.032, "#D8CCEE");
}
